<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoLive's GitHub Pages</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* 上半部分：模糊渐变遮罩 */
        .blur-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 55vh;
            /* 从上到下的模糊渐变 */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            mask-image: linear-gradient(to bottom, 
                rgba(0, 0, 0, 1) 0%,
                rgba(0, 0, 0, 1) 50%,
                rgba(0, 0, 0, 0.6) 70%,
                rgba(0, 0, 0, 0.2) 85%,
                rgba(0, 0, 0, 0) 100%
            );
            -webkit-mask-image: linear-gradient(to bottom, 
                rgba(0, 0, 0, 1) 0%,
                rgba(0, 0, 0, 1) 50%,
                rgba(0, 0, 0, 0.6) 70%,
                rgba(0, 0, 0, 0.2) 85%,
                rgba(0, 0, 0, 0) 100%
            );
        }

        /* 文字容器：独立于模糊层 */
        .text-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 55vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* 确保文字不被模糊 */
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        /* 文字样式 */
        .text-content {
            color: #003366;
            font-family: Garamond, "EB Garamond", "Cormorant Garamond", Georgia, serif;
            font-size: 2.5rem;
            text-align: center;
            line-height: 1.6;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.3);
        }

        .text-content p {
            margin: 0.3em 0;
        }
    </style>
</head>
<body>
    <div class="blur-overlay"></div>
    <div class="text-container">
        <div class="text-content">
            <p>This is ZoLive's Github Pages website.</p>
            <p>THe website is currently under construction.</p>
        </div>
    </div>
</body>
</html>
